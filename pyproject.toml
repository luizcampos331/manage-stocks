[tool.poetry]
name = "manage-stocks"
version = "0.1.0"
description = ""
authors = ["Luiz Campos <luizcampos3310@gmail.com>"]
packages = [{ include = "app" }]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.13,<4.0"
fastapi = "^0.116.1"
uvicorn = { version = "^0.35.0", extras = ["standard"] }
sqlalchemy = "^2.0.41"
asyncpg = "^0.30.0"
alembic = "^1.16.4"
redis = "^6.2.0"
greenlet = "^3.2.3"
polygon-api-client = "^1.15.3"
httpx = "^0.28.1"
beautifulsoup4 = "^4.13.4"
lxml = "^6.0.0"
loguru = "^0.7.3"

[tool.poetry.group.dev.dependencies]
ruff = "^0.12.5"
alembic = "^1.16.4"
psycopg2-binary = "^2.9.10"
pytest = "^8.4.1"
pytest-asyncio = "^1.1.0"
pytest-mock = "^3.14.1"
pytest-cov = "^6.2.1"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
extend-select = ["B", "E", "F", "I"]
fixable = ["ALL"]
