services:
    api:
        build:
            context: .
            dockerfile: Dockerfile
        ports:
            - "8000:8000"
        depends_on:
            - postgres
            - redis
        env_file:
            - .env
        command: uvicorn app.main:app --host 0.0.0.0 --port 8000

    postgres:
        image: postgres:15
        restart: always
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: manage_stocks
        ports:
            - "5432:5432"
        volumes:
            - pgdata:/var/lib/postgresql/data

    redis:
        image: redis:7
        ports:
            - "6379:6379"

volumes:
    pgdata:
